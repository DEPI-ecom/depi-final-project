services:
  postgres:
    image: postgres:17-alpine
    container_name: marketly-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: marketly
      POSTGRES_PASSWORD: marketly_dev_password
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - marketly-postgres-data:/var/lib/postgresql/data
      - ./ecom-deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketly -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  marketly-postgres-data: